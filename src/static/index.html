<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Recognition - MTCNN & FaceNet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body class="bg-gray-50 p-4">
  <div class="max-w-6xl mx-auto bg-white border border-gray-300 rounded-lg">
    <div class="border-b border-gray-300 p-6 text-center">
      <h1 class="text-2xl font-bold text-gray-800">Face Recognition System</h1>
      <p class="text-gray-600 mt-2">MTCNN + FaceNet + SVM</p>
    </div>
    <div class="p-6 space-y-6">
      <div class="border border-gray-300 rounded-lg p-5">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-300 pb-2">Thêm ảnh để Train</h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Tên người:</label>
          <input type="text" id="trainName" class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="Nhập tên người">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Chọn ảnh:</label>
          <input type="file" id="trainImage" accept="image/*" multiple
            class="w-full px-3 py-2 border border-gray-300 rounded">
          <div id="trainPreview" class="mt-3 grid grid-cols-3 gap-3"></div>
        </div>
        <button onclick="trainFace()" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Train
          Model</button>
        <div id="trainResult" class="mt-4 hidden p-3 rounded border"></div>
        <div id="trainLoading" class="mt-4 hidden text-center">
          <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin">
          </div>
          <p class="mt-2 text-gray-600">Đang train...</p>
        </div>
      </div>
      <div class="border border-gray-300 rounded-lg p-5">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-300 pb-2">Visualization - SVM Model</h2>
        <p class="text-sm text-gray-600 mb-4"><strong>Đường đỏ = ranh giới phân loại tuyến tính</strong></p>
        <div class="grid grid-cols-3 gap-3 mb-4">
          <div class="bg-blue-50 border border-blue-200 rounded p-3 text-center">
            <div class="text-2xl font-bold text-blue-700" id="vizTotalClasses">-</div>
            <div class="text-xs text-gray-600">Số người</div>
          </div>
          <div class="bg-green-50 border border-green-200 rounded p-3 text-center">
            <div class="text-2xl font-bold text-green-700" id="vizTotalImages">-</div>
            <div class="text-xs text-gray-600">Tổng ảnh</div>
          </div>
          <div class="bg-purple-50 border border-purple-200 rounded p-3 text-center">
            <div class="text-2xl font-bold text-purple-700" id="vizVariance">-</div>
            <div class="text-xs text-gray-600">PCA Variance</div>
          </div>
        </div>
        <div class="bg-white border border-gray-300 rounded p-4 mb-4">
          <canvas id="svmChart" height="400"></canvas>
        </div>
        <div class="bg-gray-50 border border-gray-300 rounded p-3 mb-4">
          <h3 class="text-sm font-semibold mb-2">Chú thích:</h3>
          <div id="classLegend" class="grid grid-cols-2 gap-2 text-sm"></div>
        </div>
        <div class="text-center">
          <button onclick="loadVisualization()"
            class="px-6 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">Tải Visualization</button>
          <div id="vizLoading" class="mt-3 hidden">
            <div class="inline-block w-6 h-6 border-4 border-purple-600 border-t-transparent rounded-full animate-spin">
            </div>
            <p class="text-sm text-gray-600 mt-1">Đang tính toán...</p>
          </div>
        </div>
      </div>
      <div class="border border-gray-300 rounded-lg p-5">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-300 pb-2">Nhận diện từ ảnh</h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Chọn ảnh:</label>
          <input type="file" id="recognizeImage" accept="image/*"
            class="w-full px-3 py-2 border border-gray-300 rounded">
          <img id="recognizePreview" class="mt-3 max-w-xs rounded border border-gray-300 hidden">
        </div>
        <button onclick="recognizeFace()" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Nhận
          diện</button>
        <div id="recognizeResult" class="mt-4 hidden p-3 rounded border"></div>
        <div id="recognizeLoading" class="mt-4 hidden text-center">
          <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin">
          </div>
          <p class="mt-2 text-gray-600">Đang xử lý...</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    const API_BASE = 'http://localhost:8000';
    let svmChartInstance = null;

    document.getElementById('trainImage').addEventListener('change', function (e) {
      const files = Array.from(e.target.files);
      const preview = document.getElementById('trainPreview');
      preview.innerHTML = '';
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function (e) {
          const div = document.createElement('div');
          div.className = 'relative';
          div.innerHTML = '<img src="' + e.target.result + '" class="w-full h-32 object-cover rounded border"><span class="absolute top-1 right-1 bg-blue-600 text-white text-xs px-2 py-1 rounded">' + (index + 1) + '</span>';
          preview.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('recognizeImage').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('recognizePreview').src = e.target.result;
          document.getElementById('recognizePreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    async function trainFace() {
      const name = document.getElementById('trainName').value.trim();
      const files = Array.from(document.getElementById('trainImage').files);
      if (!name || files.length === 0) { alert('Vui lòng nhập tên và chọn ảnh!'); return; }

      const loading = document.getElementById('trainLoading');
      const result = document.getElementById('trainResult');
      loading.classList.remove('hidden');
      result.classList.add('hidden');

      let successCount = 0;
      for (let i = 0; i < files.length; i++) {
        const formData = new FormData();
        formData.append('image', files[i]);
        formData.append('name', name);
        try {
          const response = await fetch(API_BASE + '/train', { method: 'POST', body: formData });
          const data = await response.json();
          if (data.success) successCount++;
        } catch (error) { console.error(error); }
      }

      if (successCount > 0) {
        try {
          const trainResponse = await fetch(API_BASE + '/retrain', { method: 'POST' });
          const trainData = await trainResponse.json();
          loading.classList.add('hidden');
          result.classList.remove('hidden');
          if (trainData.success) {
            result.className = 'mt-4 p-3 rounded border border-green-300 bg-green-50';
            result.innerHTML = '<strong class="text-green-700">Thành công!</strong><br>' + trainData.message.replace(/\n/g, '<br>');
            setTimeout(() => loadVisualization(), 1000);
          } else {
            result.className = 'mt-4 p-3 rounded border border-red-300 bg-red-50';
            result.innerHTML = '<strong class="text-red-700">Lỗi:</strong> ' + trainData.message;
          }
        } catch (error) {
          loading.classList.add('hidden');
          result.classList.remove('hidden');
          result.className = 'mt-4 p-3 rounded border border-red-300 bg-red-50';
          result.innerHTML = '<strong class="text-red-700">Lỗi:</strong> ' + error.message;
        }
      }
    }

    async function recognizeFace() {
      const fileInput = document.getElementById('recognizeImage');
      if (!fileInput.files[0]) { alert('Vui lòng chọn ảnh!'); return; }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async function (e) {
        const img = new Image();
        img.onload = async function () {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
          const formData = new FormData();
          formData.append('image', base64);
          formData.append('w', img.width);
          formData.append('h', img.height);
          const loading = document.getElementById('recognizeLoading');
          const result = document.getElementById('recognizeResult');
          loading.classList.remove('hidden');
          result.classList.add('hidden');
          try {
            const response = await fetch(API_BASE + '/demo/', { method: 'POST', body: formData });
            const name = await response.text();
            loading.classList.add('hidden');
            result.classList.remove('hidden');
            if (name && name !== 'Unknown') {
              result.className = 'mt-4 p-3 rounded border border-green-300 bg-green-50';
              result.innerHTML = '<strong class="text-green-700">Thành công!</strong><br>Tên: <strong>' + name + '</strong>';
            } else {
              result.className = 'mt-4 p-3 rounded border border-red-300 bg-red-50';
              result.innerHTML = '<strong class="text-red-700">Không nhận diện được</strong>';
            }
          } catch (error) {
            loading.classList.add('hidden');
            result.classList.remove('hidden');
            result.className = 'mt-4 p-3 rounded border border-red-300 bg-red-50';
            result.innerHTML = '<strong class="text-red-700">Lỗi:</strong> ' + error.message;
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function loadVisualization() {
      const loading = document.getElementById('vizLoading');
      loading.classList.remove('hidden');
      try {
        const response = await fetch(API_BASE + '/train_visualization');
        const data = await response.json();
        if (!data.success) { alert(data.message); loading.classList.add('hidden'); return; }
        
        document.getElementById('vizTotalClasses').textContent = data.total_classes;
        document.getElementById('vizTotalImages').textContent = data.total_images;
        document.getElementById('vizVariance').textContent = (data.explained_variance[0] * 100).toFixed(1) + '%';
        
        // Tạo datasets cho scatter plot
        const classMap = {};
        data.class_stats.forEach(cls => { classMap[cls.name] = { color: cls.color, data: [] }; });
        data.data_points.forEach(point => { classMap[point.class_name].data.push({ x: point.x, y: point.y }); });
        
        const datasets = [];
        Object.keys(classMap).forEach(className => {
          datasets.push({ 
            label: className, 
            data: classMap[className].data, 
            backgroundColor: classMap[className].color, 
            borderColor: classMap[className].color, 
            borderWidth: 1, 
            pointRadius: 6, 
            pointHoverRadius: 8 
          });
        });
        
        // Tính x_min, x_max, y_min, y_max từ data points
        let x_min = Infinity, x_max = -Infinity, y_min = Infinity, y_max = -Infinity;
        data.data_points.forEach(p => {
          if (p.x < x_min) x_min = p.x;
          if (p.x > x_max) x_max = p.x;
          if (p.y < y_min) y_min = p.y;
          if (p.y > y_max) y_max = p.y;
        });
        // Thêm padding
        const padX = (x_max - x_min) * 0.1;
        const padY = (y_max - y_min) * 0.1;
        x_min -= padX; x_max += padX;
        y_min -= padY; y_max += padY;
        
        const ctx = document.getElementById('svmChart').getContext('2d');
        if (svmChartInstance) svmChartInstance.destroy();
        
        // Màu cho mỗi hyperplane (tương ứng với class)
        const hpColors = ['#ef4444', '#22c55e', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'];
        
        // Plugin vẽ hyperplanes (decision boundaries)
        const hyperplanePlugin = {
          id: 'hyperplanePlugin',
          afterDatasetsDraw: function(chart) {
            if (!data.decision_boundary || !data.decision_boundary.hyperplanes) return;
            
            const ctx = chart.ctx;
            const xScale = chart.scales.x;
            const yScale = chart.scales.y;
            const hyperplanes = data.decision_boundary.hyperplanes;
            
            ctx.save();
            
            // Với mỗi hyperplane: w[0]*x + w[1]*y + b = 0
            // => y = -(w[0]*x + b) / w[1]
            hyperplanes.forEach((hp, idx) => {
              const w = hp.w;
              const b = hp.b;
              const color = hpColors[idx % hpColors.length];
              
              // Tính 2 điểm đầu cuối của đường thẳng trong vùng hiển thị
              let points = [];
              
              if (Math.abs(w[1]) > 1e-6) {
                // Tính y tại x_min và x_max
                const y_at_xmin = -(w[0] * x_min + b) / w[1];
                const y_at_xmax = -(w[0] * x_max + b) / w[1];
                points.push({ x: x_min, y: y_at_xmin });
                points.push({ x: x_max, y: y_at_xmax });
              } else if (Math.abs(w[0]) > 1e-6) {
                // Đường thẳng đứng: x = -b / w[0]
                const x_val = -b / w[0];
                points.push({ x: x_val, y: y_min });
                points.push({ x: x_val, y: y_max });
              }
              
              if (points.length === 2) {
                // Clip đường thẳng vào vùng hiển thị
                const clipped = clipLineToRect(points[0], points[1], x_min, x_max, y_min, y_max);
                if (clipped) {
                  const px1 = xScale.getPixelForValue(clipped.x1);
                  const py1 = yScale.getPixelForValue(clipped.y1);
                  const px2 = xScale.getPixelForValue(clipped.x2);
                  const py2 = yScale.getPixelForValue(clipped.y2);
                  
                  // Vẽ đường với màu tương ứng class
                  ctx.beginPath();
                  ctx.lineWidth = 2.5;
                  ctx.strokeStyle = color;
                  ctx.setLineDash([8, 4]); // đường nét đứt để phân biệt
                  ctx.moveTo(px1, py1);
                  ctx.lineTo(px2, py2);
                  ctx.stroke();
                  ctx.setLineDash([]);
                  
                  // Vẽ label cho hyperplane
                  const midX = (px1 + px2) / 2;
                  const midY = (py1 + py2) / 2;
                  ctx.fillStyle = color;
                  ctx.font = 'bold 11px Arial';
                  const label = hp.class_name || ('Class ' + idx);
                  ctx.fillText(label, midX + 5, midY - 5);
                }
              }
            });
            
            ctx.restore();
          }
        };
        
        // Hàm clip đường thẳng vào hình chữ nhật
        function clipLineToRect(p1, p2, xMin, xMax, yMin, yMax) {
          let x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
          
          // Cohen-Sutherland simplified
          function code(x, y) {
            let c = 0;
            if (x < xMin) c |= 1;
            if (x > xMax) c |= 2;
            if (y < yMin) c |= 4;
            if (y > yMax) c |= 8;
            return c;
          }
          
          let c1 = code(x1, y1), c2 = code(x2, y2);
          
          while (true) {
            if ((c1 | c2) === 0) return { x1, y1, x2, y2 };
            if ((c1 & c2) !== 0) return null;
            
            let c = c1 !== 0 ? c1 : c2;
            let x, y;
            
            if (c & 8) { x = x1 + (x2 - x1) * (yMax - y1) / (y2 - y1); y = yMax; }
            else if (c & 4) { x = x1 + (x2 - x1) * (yMin - y1) / (y2 - y1); y = yMin; }
            else if (c & 2) { y = y1 + (y2 - y1) * (xMax - x1) / (x2 - x1); x = xMax; }
            else if (c & 1) { y = y1 + (y2 - y1) * (xMin - x1) / (x2 - x1); x = xMin; }
            
            if (c === c1) { x1 = x; y1 = y; c1 = code(x1, y1); }
            else { x2 = x; y2 = y; c2 = code(x2, y2); }
          }
        }
        
        svmChartInstance = new Chart(ctx, {
          type: 'scatter',
          data: { datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 2,
            plugins: {
              title: { display: true, text: 'SVM Model - Linear Decision Boundary (One-vs-Rest)', font: { size: 16, weight: 'bold' } },
              legend: { display: true, position: 'right' }
            },
            scales: {
              x: { 
                title: { display: true, text: 'PC1', font: { size: 12, weight: 'bold' } },
                min: x_min, max: x_max
              },
              y: { 
                title: { display: true, text: 'PC2', font: { size: 12, weight: 'bold' } },
                min: y_min, max: y_max
              }
            }
          },
          plugins: [hyperplanePlugin]
        });
        
        // Cập nhật legend
        const legendDiv = document.getElementById('classLegend');
        legendDiv.innerHTML = '';
        data.class_stats.forEach(cls => {
          const item = document.createElement('div');
          item.className = 'flex items-center gap-2';
          item.innerHTML = '<div class="w-4 h-4 rounded-full" style="background-color: ' + cls.color + '"></div><span>' + cls.name + ' (' + cls.count + ' ảnh)</span>';
          legendDiv.appendChild(item);
        });
        
        if (data.decision_boundary && data.decision_boundary.hyperplanes) {
          const dbInfo = document.createElement('div');
          dbInfo.className = 'col-span-2 mt-2 pt-2 border-t text-xs text-gray-600';
          dbInfo.innerHTML = '<strong>Decision Boundary:</strong> ' + data.decision_boundary.hyperplanes.length + ' đường đỏ (One-vs-Rest cho ' + data.total_classes + ' lớp)';
          legendDiv.appendChild(dbInfo);
        }
        
        console.log('Visualization loaded with ' + (data.decision_boundary?.hyperplanes?.length || 0) + ' hyperplanes!');
      } catch (error) {
        console.error(error);
        alert('Lỗi: ' + error.message);
      } finally {
        loading.classList.add('hidden');
      }
    }
  </script>
</body>

</html>
